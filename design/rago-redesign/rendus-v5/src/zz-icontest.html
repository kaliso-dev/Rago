<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rago5.css"><style>body{background:#0A0A0B;padding:20px;width:1400px}.g{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}.c{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid #222;font:12px Barlow;color:#888}.c .row{display:flex;gap:10px;align-items:center}.c svg.i{width:24px;height:24px}.c .s svg.i{width:16px;height:16px}.c .ok{color:#3DDC97}.c .dim{color:#7C7C86}.btn.red{padding:6px 10px;background:#FF3B30}.paper{background:#ECE9E2;color:#0A0A0B;padding:4px}</style></head><body>
<div class="g" id="g"></div>
<script>
const names='check zap play search rotate sliders plus lock power file alert external activity gpu undo trash info ram net monitor cpu windows wifi folder wrench upload shield gauge eye download bulb brush user sparkles mouse maximize list globe filetext drive crosshair chat volume stop pinoff pencil pad logout enter copy clock board battery appwin refresh card users star image share infinity grid gift chev right x menu'.split(' ');
document.getElementById('g').innerHTML=names.map(n=>`<div class="c"><div class="row"><i data-i="${n}"></i><span class="s"><i data-i="${n}"></i></span><span class="s dim"><i data-i="${n}"></i></span><span class="s ok"><i data-i="${n}"></i></span><span class="btn red s"><i data-i="${n}"></i></span><span class="paper s"><i data-i="${n}"></i></span></div>${n}</div>`).join('');
</script><script src="icons.js"></script></body></html>
