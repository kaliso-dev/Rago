<script src="seq.js"></script>
<script>
const $ = id => document.getElementById(id);
const segs = [...document.querySelectorAll('#seg i')];
const RC = [38.7, 42.5];   // centre du R
const DX = 4.5, DY = 5.2;
const MSG = [[0, 'Checking Windows'], [1500, 'Reading drivers and games'], [2150, 'Testing your connection'], [2700, 'Ready']];
window.__seq = { duration: 3400, seek(t) {
  // 1. le R tombe comme un tampon
  const a = E.k(t, 120, 340), sc = E.lerp(1.7, 1, E.slam(a));
  const op = E.k(t, 120, 200);
  const sh = E.shake(t, 340, 260, 3.2);
  $('rg').setAttribute('transform', `translate(${6 + sh} 14) translate(${RC[0]} ${RC[1]}) scale(${sc}) translate(${-RC[0]} ${-RC[1]})`);
  $('rf').style.opacity = op;
  // 2. la couche rouge se décale au moment de l'impact
  const b = E.out(E.k(t, 330, 520));
  $('rb').style.opacity = E.k(t, 330, 360);
  $('rb').setAttribute('transform', `translate(${DX * b} ${DY * b})`);
  // 3. AGO glisse derrière une découpe
  const c = E.out(E.k(t, 430, 760));
  $('acr').setAttribute('x', 84 - 6 * c); $('acr').setAttribute('width', 300 * c);
  $('af').setAttribute('x', 83 - 10 * (1 - c));
  const d = E.out(E.k(t, 620, 820));
  $('ab').setAttribute('x', 83 - 10 * (1 - c) + DX * d); $('ab').setAttribute('y', 99 + DY * d); $('ab').style.opacity = d > 0 ? 1 : 0;
  // 4. la bande OPTIMIZER se déroule
  const e = E.outQ(E.k(t, 700, 960));
  $('tape').style.clipPath = `inset(-6px ${(1 - e) * 100}% -6px -6px)`;
  // 5. statut et barre
  $('st').style.opacity = E.k(t, 820, 1000); $('st').style.transform = `translateY(${8 * (1 - E.out(E.k(t, 820, 1100)))}px)`;
  const p = E.inOut(E.k(t, 1000, 2700));
  $('pc').textContent = Math.round(p * 100);
  const n = Math.round(p * segs.length);
  segs.forEach((s, i) => s.className = i < n ? 'f' : '');
  let m = MSG[0][1]; for (const [tm, txt] of MSG) if (t >= tm) m = txt; $('msg').textContent = m;
  $('msg').style.color = t >= 2700 ? 'var(--ink)' : '';
} };
__seq.seek(location.hash === '#end' ? 99999 : 0);
</script></body></html>
