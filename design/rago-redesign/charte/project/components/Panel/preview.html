<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--bg)}
.stage{padding:24px 28px;min-height:100%}
.cap{display:block;margin:0 0 10px}
.score{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:44px;padding:26px 30px;--carbon-w:340px}.gr b{display:block;font-family:var(--font-display);font-weight:900;font-style:italic;font-size:88px;line-height:.78;text-transform:uppercase}.gr span{display:block;margin-top:10px;font-family:var(--font-display);font-weight:900;font-style:italic;font-size:22px;line-height:.9;text-transform:uppercase;color:var(--ink-2)}.mets{display:flex;gap:46px;padding-left:44px;border-left:1px solid var(--line-2)}.met b{display:block;font-family:var(--font-display);font-weight:900;font-style:italic;font-size:64px;line-height:.78}.met b small{font-size:22px;color:var(--ink-2);margin-left:4px}.met .rg-label{display:block;margin-top:10px}.ag{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
</style>
</head>
<body>
<div class="rg-ground stage">
<section class="rg-panel rg-carbon score">
  <div class="gr"><b>great</b><span>connection</span></div>
  <div class="mets">
    <div class="met"><b>18<small>ms</small></b><span class="rg-label">ping</span></div>
    <div class="met"><b>2<small>ms</small></b><span class="rg-label">jitter</span></div>
    <div class="met"><b>0<small>%</small></b><span class="rg-label">loss</span></div>
  </div>
  <div class="ag"><span class="rg-btn is-red"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>test again</span><span class="rg-sub">tested 2 min ago</span></div>
</section>
</div>
</body>
</html>
