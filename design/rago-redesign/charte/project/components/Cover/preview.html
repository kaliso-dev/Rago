<!-- @dsCard height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rago Optimizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,900&family=Barlow:wght@400&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; width:960px; height:300px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:480px; height:300px; }
  .red { fill:var(--red); }
  .deep { fill:var(--red-deep); }
  .paper { fill:var(--paper); }
  .dark { fill:var(--bg-4); }
  .hatch { stroke:var(--red); stroke-width:var(--space-8); }
  .slab { rx:var(--radius-panel); }
  .card { rx:var(--radius-card); }
  .words { position:absolute; left:var(--space-40); bottom:var(--space-40); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:900; font-style:italic; font-size:80px; line-height:.95; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-14) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      red 190 wide slab bleeding top and bottom (the SignatureBlock, the brand's one loud field) · red-deep 160 square bleeding bottom right (pressed red) · bg-4 160 x 170 block top right (the highest dark step, carrying the pattern) · paper 230 x 44 tape across the slab · about 38% of 960 x 300
  arrangement one tall slab with satellites, every block skewed by angle-skew (-12deg) like the app's cuts; the paper tape rotated by angle-tape (-1.4deg) as on section titles
  pattern     the pending hatch: 8px red stripes at angle-carbon (-60deg) on a space-16 pitch, clipped to the bg-4 block; chosen because "loud, bold, poster type" and because the hatch is the system's own state pattern
  scales      gaps space-14 to space-22; stripe width space-8, pitch space-16 (18.5 horizontally); corners radius-panel on the slab, radius-card on the satellites, square tape
-->
<defs><clipPath id="hb"><rect class="card" x="372" y="-20" width="160" height="170" rx="18" transform="skewX(-12)"/></clipPath></defs>
<rect class="red slab" x="150" y="-30" width="190" height="360" rx="22" transform="skewX(-12)"/>
<rect class="deep card" x="392" y="172" width="160" height="160" rx="18" transform="skewX(-12)"/>
<rect class="dark card" x="372" y="-20" width="160" height="170" rx="18" transform="skewX(-12)"/>
<g clip-path="url(#hb)">
<line class="hatch" x1="268.0" y1="190" x2="388.0" y2="-17.8"/>
<line class="hatch" x1="286.5" y1="190" x2="406.5" y2="-17.8"/>
<line class="hatch" x1="305.0" y1="190" x2="425.0" y2="-17.8"/>
<line class="hatch" x1="323.5" y1="190" x2="443.5" y2="-17.8"/>
<line class="hatch" x1="342.0" y1="190" x2="462.0" y2="-17.8"/>
<line class="hatch" x1="360.5" y1="190" x2="480.5" y2="-17.8"/>
<line class="hatch" x1="379.0" y1="190" x2="499.0" y2="-17.8"/>
<line class="hatch" x1="397.5" y1="190" x2="517.5" y2="-17.8"/>
<line class="hatch" x1="416.0" y1="190" x2="536.0" y2="-17.8"/>
<line class="hatch" x1="434.5" y1="190" x2="554.5" y2="-17.8"/>
<line class="hatch" x1="453.0" y1="190" x2="573.0" y2="-17.8"/>
<line class="hatch" x1="471.5" y1="190" x2="591.5" y2="-17.8"/>
<line class="hatch" x1="490.0" y1="190" x2="610.0" y2="-17.8"/>
<line class="hatch" x1="508.5" y1="190" x2="628.5" y2="-17.8"/>
</g>
<rect class="paper" x="44" y="98" width="230" height="44" transform="rotate(-1.4 159 120)"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Rago<br>Optimizer</h1>
  <p class="tag">Every millisecond counts.</p>
</div>
</div>
</body>
</html>
