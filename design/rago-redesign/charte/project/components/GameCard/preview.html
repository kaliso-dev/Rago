<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GameCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--bg)}
.stage{padding:24px 28px;min-height:100%}
.cap{display:block;margin:0 0 10px}

</style>
</head>
<body>
<div class="rg-ground stage">
<div class="rg-games">
  <div class="rg-game is-sel">
    <div class="rg-poster" style="--p1:#ff3b30;--p2:#16070a;--p3:#f5f5f6;--gs:74px"><span class="band"></span><span class="gl">valorant</span><span class="rg-chip is-cover">riot client</span></div>
    <div class="info"><div><b>valorant</b><span class="rg-sub">21 tweaks on</span></div><span class="rg-sq is-red"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></div>
  </div>
  <div class="rg-game">
    <div class="rg-poster" style="--p1:#3ddc97;--p2:#08130e;--p3:#f5f5f6;--gs:64px"><span class="band"></span><span class="gl">minecraft</span><span class="rg-chip is-cover">lunar client</span></div>
    <div class="info"><div><b>minecraft</b><span class="rg-sub">not optimized yet</span></div><span class="rg-sq"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17a1 1 0 0 0 1.5.86l14.2-8.5a1 1 0 0 0 0-1.72L7.5 2.64A1 1 0 0 0 6 3.5z"/></svg></span></div>
  </div>
  <div class="rg-game">
    <div class="rg-poster" style="--p1:#f5f5f6;--p2:#17171a;--p3:#ff3b30;--gs:110px"><span class="band"></span><span class="gl">cs2</span><span class="rg-chip is-cover">steam</span></div>
    <div class="info"><div><b>counter-strike 2</b><span class="rg-sub">not optimized yet</span></div><span class="rg-sq"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17a1 1 0 0 0 1.5.86l14.2-8.5a1 1 0 0 0 0-1.72L7.5 2.64A1 1 0 0 0 6 3.5z"/></svg></span></div>
  </div>
</div>
</div>
</body>
</html>
