<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PresetCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--bg)}
.stage{padding:24px 28px;min-height:100%}
.cap{display:block;margin:0 0 10px}

</style>
</head>
<body>
<div class="rg-ground stage">
<div class="rg-presets">
  <div class="rg-preset is-on"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M22 12h-4M6 12H2M12 6V2M12 22v-4"/></svg><em class="ck"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></em><b>hitreg</b><span>Your hits leave instantly</span></div>
  <div class="rg-preset"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><b>knockback</b><span>Server hits land instantly</span></div>
  <div class="rg-preset"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg><b>balanced</b><span>Downloads stay fast</span></div>
  <div class="rg-preset"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/></svg><b>wi-fi</b><span>Full power, no hopping</span></div>
  <div class="rg-preset"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></svg><b>packet loss</b><span>4G, ADSL or a busy home</span></div>
  <div class="rg-preset"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11zM6 16h.01M10 16h.01"/></svg><b>old-school</b><span>Fixed 64 KB window</span></div>
</div>
</div>
</body>
</html>
