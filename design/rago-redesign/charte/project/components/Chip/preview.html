<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--bg)}
.stage{padding:24px 28px;min-height:100%}
.cap{display:block;margin:0 0 10px}

</style>
</head>
<body>
<div class="rg-ground stage">
<div class="rg-row" style="gap:10px">
  <span class="rg-chip"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>premium</span>
  <span class="rg-chip is-red">free plan</span>
  <span class="rg-chip is-ghost"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/></svg>fiber detected</span>
  <span class="rg-chip is-ghost">beta</span>
  <span class="rg-chip is-red"><i class="rg-dot"></i>live</span>
</div>
</div>
</body>
</html>
