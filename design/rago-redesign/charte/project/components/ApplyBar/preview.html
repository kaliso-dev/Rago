<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ApplyBar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--bg)}
.stage{padding:24px 28px;min-height:100%}
.cap{display:block;margin:0 0 10px}
.stack{display:flex;flex-direction:column;align-items:center;gap:22px;padding:6px 0}
</style>
</head>
<body>
<div class="rg-ground stage">
<div class="stack">
  <div class="rg-bar rg-carbon"><b>3</b><span class="lb">changes ready<small><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>restart needed for 2</small></span><span class="rg-link">clear</span><span class="rg-btn is-red"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>apply</span></div>
  <div class="rg-bar rg-carbon"><b>hitreg</b><span class="lb">not applied yet<small><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/></svg>drops for a few seconds</small></span><span class="rg-link">restore</span><span class="rg-btn is-red"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>apply</span></div>
</div>
</div>
</body>
</html>
