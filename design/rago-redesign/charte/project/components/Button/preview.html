<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--bg)}
.stage{padding:24px 28px;min-height:100%}
.cap{display:block;margin:0 0 10px}

</style>
</head>
<body>
<div class="rg-ground stage">
<div class="rg-col" style="gap:22px">
  <div class="rg-row">
    <span class="rg-btn is-red is-lg"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>apply 18 free tweaks</span>
    <span class="rg-btn is-red"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>test again</span>
    <span class="rg-btn"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>turn off</span>
    <span class="rg-btn is-sm"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>select safe</span>
    <span class="rg-link">restore</span>
  </div>
  <div class="rg-row">
    <span class="rg-btn is-red is-pressed"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>applying</span>
    <span class="rg-btn is-sm"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>stability test</span>
    <span class="rg-btn is-sm"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>bufferbloat test</span>
  </div>
</div>
</div>
</body>
</html>
