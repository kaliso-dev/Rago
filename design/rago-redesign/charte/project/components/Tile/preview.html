<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--bg)}
.stage{padding:24px 28px;min-height:100%}
.cap{display:block;margin:0 0 10px}

</style>
</head>
<body>
<div class="rg-ground stage">
<div class="rg-tiles">
  <div class="rg-tile"><span class="nm">no nagle delay</span><i class="rg-sw"></i></div>
  <div class="rg-tile is-on"><span class="nm">dns cache first</span><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg><i class="rg-sw is-on"></i></div>
  <div class="rg-tile is-pend"><span class="nm">msi mode</span><i class="rg-sw is-pend"></i></div>
  <div class="rg-tile is-hover"><span class="nm">tcp/ip tuning</span><i class="rg-sw"></i></div>
  <div class="rg-tile"><span class="nm">connection</span><span class="val">fiber / ethernet</span><svg class="rg-i end" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
  <div class="rg-tile is-adv"><span class="nm">advanced</span><em>5</em><svg class="rg-i end" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
  <div class="rg-tile is-add"><svg class="rg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg><span class="nm">phone 4g</span><small>about 80 MB per hour</small></div>
</div>
</div>
</body>
</html>
