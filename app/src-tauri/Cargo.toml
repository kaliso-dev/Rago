[package]
name = "rago-hub"
version = "1.2.0"
description = "Rago Optimizer, the Windows optimizer for Minecraft PvP and competitive games"
authors = ["Rago"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "rago_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# Rago OS : fond d'écran (IDesktopWallpaper), écran de verrouillage et applications du Store (API WinRT de Windows)
windows = { version = "0.62", features = ["ApplicationModel", "Foundation", "Foundation_Collections", "Management_Deployment", "Storage", "Storage_Streams", "System_UserProfile", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
