[package]
name = "rago-hub"
version = "1.3.0"
description = "Rago Optimizer, the Windows optimizer for Minecraft PvP and competitive games"
authors = ["KALISO", "RAGO"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "rago_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
# Rago Route : tunnel chiffré (échange de clés X25519, ChaCha20-Poly1305), comme proxy/rago-route.py
x25519-dalek = { version = "2", features = ["getrandom"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
getrandom = "0.2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_ColorSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
