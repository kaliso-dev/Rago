# À placer à la racine du dépôt : .github/workflows/app-windows.yml
# Construit l'installateur Windows (NSIS) de Rago Optimizer Premium, qui vit dans app/.
# Secrets : RAGO_API_BASE, RAGO_LICENSE_PUBKEY. Variable : SITE_URL.
name: app-windows

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-windows.yml"]

defaults:
  run:
    working-directory: app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Tests du moteur
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          RAGO_API_BASE: ${{ secrets.RAGO_API_BASE }}
          RAGO_LICENSE_PUBKEY: ${{ secrets.RAGO_LICENSE_PUBKEY }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_ACCOUNT_URL: ${{ secrets.RAGO_API_BASE }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Rago Optimizer ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: rago-optimizer-setup
          path: app/src-tauri/target/release/bundle/nsis/*.exe
