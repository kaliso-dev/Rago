# Construit l'installateur Windows (NSIS) de Rago Optimizer, qui vit dans app/.
# Secrets : RAGO_API_BASE, RAGO_LICENSE_PUBKEY, RAGO_SCRIPTS_SECRET (même valeur que SCRIPTS_SECRET sur Railway :
# chiffre les scripts Premium dans l'exe). Variables : SITE_URL, SUPPORT_URL (facultative).
name: app-windows

on:
  workflow_dispatch:
  push:
    # chaque modification de l'app refabrique l'exe ; les tags app-v* publient une release
    # (GitHub n'applique pas le filtre paths aux tags)
    branches: ["**"]
    tags: ["app-v*"]
    paths: ["app/**", ".github/workflows/app-windows.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-windows.yml"]

# un seul build par branche : un nouveau push annule le précédent
concurrency:
  group: app-windows-${{ github.ref }}
  cancel-in-progress: true

# écriture nécessaire au brouillon de release sur les tags app-v*
permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Vérifier les secrets
        # sans eux, l'exe ne peut jamais passer en Premium : on refuse de le fabriquer
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: .
        env:
          API_BASE: ${{ secrets.RAGO_API_BASE }}
          PUBKEY: ${{ secrets.RAGO_LICENSE_PUBKEY }}
          SCRIPTS: ${{ secrets.RAGO_SCRIPTS_SECRET }}
        run: |
          if [ -z "$API_BASE" ] || [ -z "$PUBKEY" ]; then
            echo "::error::Secrets RAGO_API_BASE et RAGO_LICENSE_PUBKEY manquants (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -z "$SCRIPTS" ]; then
            echo "::error::Secret RAGO_SCRIPTS_SECRET manquant : même valeur que SCRIPTS_SECRET sur Railway (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Tests du moteur
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          RAGO_API_BASE: ${{ secrets.RAGO_API_BASE }}
          RAGO_LICENSE_PUBKEY: ${{ secrets.RAGO_LICENSE_PUBKEY }}
          RAGO_SCRIPTS_SECRET: ${{ secrets.RAGO_SCRIPTS_SECRET }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_ACCOUNT_URL: ${{ secrets.RAGO_API_BASE }}
          # invitation Discord du support (facultatif : sans elle, aucun bouton d'aide)
          VITE_SUPPORT_URL: ${{ vars.SUPPORT_URL }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Rago Optimizer ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: rago-optimizer-setup
          path: app/src-tauri/target/release/bundle/nsis/*.exe
