# Construit l'installateur Windows (NSIS) de Rago Optimizer, qui vit dans app/.
# Secrets : RAGO_API_BASE, RAGO_LICENSE_PUBKEY, RAGO_SCRIPTS_SECRET (même valeur que SCRIPTS_SECRET sur Railway :
# chiffre les scripts Premium dans l'exe). Variables : SITE_URL, SUPPORT_URL (facultative).
# Exe de test (branche staging, ou « staging » choisi dans Run workflow) : « Rago Optimizer Staging », relié au serveur
# de test avec les secrets STAGING_RAGO_API_BASE, STAGING_RAGO_LICENSE_PUBKEY et la variable STAGING_SITE_URL.
# Il s'installe à côté du vrai ; à ne jamais déposer dans le Supabase de production (DEVELOPPEMENT.md).
# Mises à jour automatiques (RAG-24) : avec le secret TAURI_SIGNING_PRIVATE_KEY (et TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# s'il a un mot de passe) et la variable RAGO_UPDATER_PUBKEY, l'exe sait se mettre à jour et le build signe
# l'installateur : le fichier .exe.sig est dans l'artefact, à déposer à côté de l'exe. Sans eux, exe sans mise à jour.
# Barre en jeu (RAG-82) : PresentMon, l'outil d'Intel qui mesure les FPS, est téléchargé à chaque build (pas dans git).
name: app-windows

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Serveur auquel l'exe se connecte"
        type: choice
        options: [production, staging]
        default: production
  push:
    # chaque modification de l'app refabrique l'exe ; les tags app-v* publient une release
    # (GitHub n'applique pas le filtre paths aux tags)
    branches: ["**"]
    tags: ["app-v*"]
    paths: ["app/**", ".github/workflows/app-windows.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-windows.yml"]

# un seul build par branche : un nouveau push annule le précédent
concurrency:
  group: app-windows-${{ github.ref }}
  cancel-in-progress: true

# écriture nécessaire au brouillon de release sur les tags app-v*
permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Choisir le serveur et vérifier les secrets
        # Sans eux, l'exe ne peut jamais passer en Premium : on refuse de le fabriquer (sauf pour une pull request,
        # qui n'a pas toujours accès aux secrets). Un exe de test ne prend jamais les secrets du vrai serveur.
        shell: bash
        working-directory: .
        env:
          TARGET: ${{ (github.ref_name == 'staging' || inputs.server == 'staging') && 'staging' || 'production' }}
          STRICT: ${{ github.event_name != 'pull_request' }}
          PROD_API: ${{ secrets.RAGO_API_BASE }}
          PROD_PUBKEY: ${{ secrets.RAGO_LICENSE_PUBKEY }}
          PROD_SITE: ${{ vars.SITE_URL }}
          STAGING_API: ${{ secrets.STAGING_RAGO_API_BASE }}
          STAGING_PUBKEY: ${{ secrets.STAGING_RAGO_LICENSE_PUBKEY }}
          STAGING_SITE: ${{ vars.STAGING_SITE_URL }}
          SCRIPTS: ${{ secrets.RAGO_SCRIPTS_SECRET }}
        run: |
          if [ "$TARGET" = staging ]; then
            API_BASE=$STAGING_API; PUBKEY=$STAGING_PUBKEY; SITE=$STAGING_SITE; NAMES="STAGING_RAGO_API_BASE et STAGING_RAGO_LICENSE_PUBKEY"
          else
            API_BASE=$PROD_API; PUBKEY=$PROD_PUBKEY; SITE=$PROD_SITE; NAMES="RAGO_API_BASE et RAGO_LICENSE_PUBKEY"
          fi
          echo "Exe pour le serveur : $TARGET"
          missing=""
          if [ -z "$API_BASE" ] || [ -z "$PUBKEY" ]; then missing="Secrets $NAMES manquants (Settings > Secrets and variables > Actions)"; fi
          if [ -z "$SCRIPTS" ]; then missing="${missing:+$missing. }Secret RAGO_SCRIPTS_SECRET manquant : même valeur que SCRIPTS_SECRET sur Railway"; fi
          if [ -n "$missing" ]; then
            if [ "$STRICT" = true ]; then echo "::error::$missing"; exit 1; fi
            echo "::warning::$missing"
          fi
          if [ "$TARGET" = staging ] && [ -n "$API_BASE" ] && [ "$API_BASE" = "$PROD_API" ]; then
            echo "::error::STAGING_RAGO_API_BASE est l'adresse du vrai serveur : mets celle du serveur de test"
            exit 1
          fi
          {
            echo "RAGO_TARGET=$TARGET"
            echo "RAGO_API_BASE=$API_BASE"
            echo "VITE_ACCOUNT_URL=$API_BASE"
            echo "VITE_SITE_URL=$SITE"
            if [ "$TARGET" = staging ]; then echo "VITE_RAGO_SERVER=staging"; fi
            echo "RAGO_LICENSE_PUBKEY<<RAGO_PUBKEY_END"
            echo "$PUBKEY"
            echo "RAGO_PUBKEY_END"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Exe de test, nom et identifiant à part
        # « Rago Optimizer Staging » s'installe à côté du vrai et ne remplace pas son installation
        if: env.RAGO_TARGET == 'staging'
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json', fs=require('fs'); fs.writeFileSync(f, JSON.stringify({ ...JSON.parse(fs.readFileSync(f, 'utf8')), ...JSON.parse(fs.readFileSync('src-tauri/tauri.staging.conf.json', 'utf8')) }, null, 2))"
      - name: Mises à jour signées
        # la clé publique va dans l'exe (il refuse tout installateur qui n'est pas signé avec la clé privée)
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBKEY: ${{ vars.RAGO_UPDATER_PUBKEY }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$UPDATER_PUBKEY" ]; then
            echo "::warning::Exe sans mise à jour automatique : secret TAURI_SIGNING_PRIVATE_KEY ou variable RAGO_UPDATER_PUBKEY manquant"
            exit 0
          fi
          node -e "const f='src-tauri/tauri.conf.json', fs=require('fs'), c=JSON.parse(fs.readFileSync(f, 'utf8')); c.bundle.createUpdaterArtifacts=true; c.plugins.updater.pubkey=process.env.UPDATER_PUBKEY.trim(); fs.writeFileSync(f, JSON.stringify(c, null, 2))"
          echo "Exe avec mise à jour automatique"
      - name: PresentMon (FPS de la barre en jeu)
        # outil d'Intel (licence MIT) livré dans resources\ : sans lui l'exe marche, les FPS restent « — ». Gardé
        # seulement s'il est signé par Intel.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRESENTMON_TAG: v2.3.0
        run: |
          dir=$(mktemp -d)
          gh release download "$PRESENTMON_TAG" --repo GameTechDev/PresentMon --pattern 'PresentMon-*-x64.exe' --dir "$dir" \
            || gh release download --repo GameTechDev/PresentMon --pattern 'PresentMon-*-x64.exe' --dir "$dir" \
            || true
          exe=$(ls "$dir" 2>/dev/null | grep -E '^PresentMon-[0-9.]+-x64\.exe$' | sort -V | tail -1)
          if [ -z "$exe" ]; then echo "::warning::PresentMon introuvable : exe sans FPS dans la barre en jeu"; exit 0; fi
          signer=$(pwsh -NoProfile -Command "\$s = Get-AuthenticodeSignature '$(cygpath -w "$dir/$exe")'; if (\$s.Status -eq 'Valid') { \$s.SignerCertificate.Subject }")
          case "$signer" in
            *"O=Intel Corporation"*) ;;
            *) echo "::warning::$exe n'est pas signé par Intel ($signer) : exe sans FPS dans la barre en jeu"; exit 0 ;;
          esac
          cp "$dir/$exe" src-tauri/resources/PresentMon.exe
          for f in LICENSE.txt LICENSE; do
            gh api "repos/GameTechDev/PresentMon/contents/$f" -H "Accept: application/vnd.github.raw" > src-tauri/resources/PresentMon-LICENSE.txt 2>/dev/null && break
          done
          [ -s src-tauri/resources/PresentMon-LICENSE.txt ] || { rm -f src-tauri/resources/PresentMon-LICENSE.txt; echo "::warning::licence de PresentMon introuvable"; }
          echo "PresentMon livré : $exe ($signer)"
      - run: npm ci
      - name: Tests du moteur
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        # RAGO_API_BASE, RAGO_LICENSE_PUBKEY, VITE_SITE_URL et VITE_ACCOUNT_URL viennent de l'étape « Choisir le serveur »
        env:
          RAGO_SCRIPTS_SECRET: ${{ secrets.RAGO_SCRIPTS_SECRET }}
          # signature de l'installateur pour les mises à jour (vides : pas de signature, voir « Mises à jour signées »)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # invitation Discord du support (facultatif : sans elle, aucun bouton d'aide)
          VITE_SUPPORT_URL: ${{ vars.SUPPORT_URL }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && env.RAGO_TARGET != 'staging' && github.ref_name || '' }}
          releaseName: Rago Optimizer ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAGO_TARGET == 'staging' && 'rago-optimizer-setup-STAGING' || 'rago-optimizer-setup' }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
