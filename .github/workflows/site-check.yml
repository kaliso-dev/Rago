# Vérifie que site/index.html, site/reviews.html, site/tweaks.html et site/partners.html (pages publiées par Netlify) ont bien été
# régénérées depuis site/src/page.html, site/src/reviews.html, site/src/tweaks.html et site/src/partners.html (cartes partenaires : site/src/partners.json).
name: site-check

on:
  workflow_dispatch:
  push:
    paths: ["site/**", ".github/workflows/site-check.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site-check.yml"]

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  index-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # build.py fait précalculer les sections dynamiques par prerender.js (Playwright).
      # Même version que celle qui a fabriqué index.html, pour un résultat identique.
      - name: Installer Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Régénérer index.html, reviews.html, tweaks.html et partners.html
        shell: bash
        run: |
          python3 site/tools/build.py 2>&1 | tee build.log
          if grep -q "warning: no-JS sections not baked" build.log; then echo "::error::prerender.js n'a pas tourné"; exit 1; fi
      - name: Comparer avec la version poussée
        run: |
          if ! git diff --exit-code -- site/index.html site/reviews.html site/tweaks.html site/partners.html || ! git ls-files --error-unmatch site/partners.html >/dev/null 2>&1; then
            echo "::error::site/index.html, site/reviews.html, site/tweaks.html ou site/partners.html n'est pas à jour : lance python3 site/tools/build.py et pousse le résultat"
            exit 1
          fi
