# Lance les tests du serveur de licences (dossier licensing/) à chaque push. Railway attend ce résultat avant de redéployer si « Wait for CI » est activé.
name: licensing-tests

on:
  workflow_dispatch:
  push:
    paths: ["licensing/**", ".github/workflows/licensing-tests.yml"]
  pull_request:
    paths: ["licensing/**", ".github/workflows/licensing-tests.yml"]

concurrency:
  group: licensing-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: licensing

jobs:
  test:
    runs-on: ubuntu-latest
    # vraie base Postgres 16 pour le test « real Postgres » (actif seulement avec TEST_DATABASE_URL)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: licensing/package-lock.json
      - run: npm ci
      - name: Tests (base en mémoire, PGlite)
        run: npm test
      - name: Tests (vraie base Postgres 16)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
